<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src x2file: data: blob:; media-src x2file:; font-src x2file: data:; style-src 'self' 'unsafe-inline'; frame-src x2file: blob:;">
  <title>Xplorer² Modern</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/viewer.css">
</head>
<body>
  <div id="titlebar">
    <div class="tb-left"><span class="app-mark" data-icon="layout-grid" data-icon-size="15"></span><b>Xplorer²</b><span class="tb-sub">Modern</span></div>
    <div id="titlebar-drag"></div>
    <div class="tb-right">
      <button id="win-min" title="Minimize" data-icon="minimize" data-icon-size="14"></button>
      <button id="win-max" title="Maximize" data-icon="maximize" data-icon-size="13"></button>
      <button id="win-close" title="Close" data-icon="close" data-icon-size="14"></button>
    </div>
  </div>

  <div id="ribbon" role="toolbar" aria-label="Main toolbar">
    <div class="rb-group">
      <button data-cmd="newFolder" class="chr-btn rb" title="New folder (Ctrl+Shift+N)"><span class="ic" data-icon="folder-plus"></span><span class="lbl">New</span><span class="kbd">Ctrl+Shift+N</span></button>
      <button data-cmd="copy" class="chr-btn rb" title="Copy (F5)"><span class="ic" data-icon="copy"></span><span class="lbl">Copy</span><span class="kbd">F5</span></button>
      <button data-cmd="move" class="chr-btn rb" title="Move (F6)"><span class="ic" data-icon="scissors"></span><span class="lbl">Move</span><span class="kbd">F6</span></button>
      <button data-cmd="deleteBin" class="chr-btn rb" title="Delete to recycle bin (Del)"><span class="ic" data-icon="trash"></span><span class="lbl">Delete</span><span class="kbd">Del</span></button>
      <button data-cmd="rename" class="chr-btn rb" title="Rename (F2)"><span class="ic" data-icon="pencil"></span><span class="lbl">Rename</span><span class="kbd">F2</span></button>
    </div>
    <div class="sep"></div>
    <div class="rb-group">
      <button data-cmd="viewMode" class="chr-btn rb" title="Cycle details / list / thumbnails"><span class="ic" data-icon="layout-grid"></span><span class="lbl">View</span></button>
      <button data-cmd="themeToggle" class="chr-btn rb" title="Toggle light / dark theme"><span class="ic" data-icon="moon"></span><span class="lbl">Theme</span></button>
      <button data-cmd="toggleTree" class="chr-btn rb" title="Toggle folder tree (Ctrl+T)"><span class="ic" data-icon="tree"></span><span class="lbl">Tree</span><span class="kbd">Ctrl+T</span></button>
      <button data-cmd="togglePreview" class="chr-btn rb" title="Toggle preview pane (Ctrl+Alt+Z)"><span class="ic" data-icon="panel-right"></span><span class="lbl">Preview</span><span class="kbd">Ctrl+Alt+Z</span></button>
      <button data-cmd="filter" class="chr-btn rb" title="Filter this folder (F3)"><span class="ic" data-icon="filter"></span><span class="lbl">Filter</span><span class="kbd">F3</span></button>
    </div>
    <div class="sep"></div>
    <div class="rb-group">
      <button data-cmd="find" class="chr-btn rb" title="Find files (Ctrl+F)"><span class="ic" data-icon="search"></span><span class="lbl">Find</span><span class="kbd">Ctrl+F</span></button>
      <button data-cmd="dupes" class="chr-btn rb" title="Find duplicates (Ctrl+D)"><span class="ic" data-icon="layers"></span><span class="lbl">Dupes</span><span class="kbd">Ctrl+D</span></button>
      <button data-cmd="compare" class="chr-btn rb" title="Compare panes (F9)"><span class="ic" data-icon="git-compare"></span><span class="lbl">Compare</span><span class="kbd">F9</span></button>
      <button data-cmd="toScrap" class="chr-btn rb" title="Send selection to scrap (Ctrl+S)"><span class="ic" data-icon="plus-square"></span><span class="lbl">Scrap</span><span class="kbd">Ctrl+S</span></button>
      <button data-cmd="stats" class="chr-btn rb" title="Folder sizes & pie (Ctrl+G)"><span class="ic" data-icon="pie"></span><span class="lbl">Fold. size</span><span class="kbd">Ctrl+G</span></button>
    </div>
    <div class="sep"></div>
    <div class="rb-group">
      <button data-cmd="props" class="chr-btn rb" title="Properties & timestamps (Alt+Enter)"><span class="ic" data-icon="sliders"></span><span class="lbl">Props</span><span class="kbd">Alt+Enter</span></button>
      <button data-cmd="settings" class="chr-btn rb" title="Settings (Ctrl+,)"><span class="ic" data-icon="settings"></span><span class="lbl">Settings</span><span class="kbd">Ctrl+,</span></button>
      <button data-cmd="palette" class="chr-btn rb" title="Command palette (Ctrl+K)"><span class="ic" data-icon="command"></span><span class="lbl">Commands</span><span class="kbd">Ctrl+K</span></button>
    </div>
    <div class="rb-refresh"><button data-cmd="refresh" class="chr-btn icon-only muted" title="Refresh (web: F5)"><span data-icon="refresh"></span></button></div>
  </div>

  <div id="mainbar">
    <div id="drivebar"></div>
    <div class="addr-wrap">
      <button id="nav-back" class="chr-btn icon-only muted" title="Back (Alt+←)" data-icon="arrow-left" data-icon-size="15"></button>
      <button id="nav-fwd" class="chr-btn icon-only muted" title="Forward (Alt+→)" data-icon="arrow-right" data-icon-size="15"></button>
      <button id="nav-up" class="chr-btn icon-only muted" title="Up one level (Backspace)" data-icon="arrow-up" data-icon-size="15"></button>
      <span class="chr-sep"></span>
      <button id="nav-copy-path" class="chr-btn icon-only muted" title="Copy path(s): selection first, then current folder (Ctrl+P)" data-icon="copy" data-icon-size="15"></button>
      <button id="nav-copy-mode" class="chr-btn icon-only sm muted" title="Path copy format…" data-icon="more" data-icon-size="15"></button>
      <input id="address" class="chr-input" type="text" autocomplete="off" spellcheck="false" placeholder="Type a path, or > command …" aria-label="Address bar">
      <div id="addr-recent" class="hidden" role="listbox" aria-label="Recent locations"></div>
      <div id="completions" class="hidden" role="listbox" aria-label="Path completions"></div>
    </div>
    <button id="btn-bookmark" class="chr-btn icon-only muted" title="Bookmark this location (Ctrl+Q)" data-icon="star" data-icon-size="15"></button>
    <input id="filter-input" class="chr-input sm hidden" type="text" placeholder="wildcard or *text* — Enter applies, Esc clears" autocomplete="off" spellcheck="false" aria-label="Filter">
    <div id="mirror-toggle" class="chr-toggle" title="Mirror browsing: keep the other pane on the same folder"><span class="ic" data-icon="mirror" data-icon-size="15"></span><span>Mirror</span></div>
  </div>

  <div id="panes">
    <div class="pane" id="pane-L">
      <div class="tabs-row"><div class="tabs" role="tablist"></div><button class="tab-new chr-btn icon-only sm muted" title="New tab (Ctrl+T)" data-icon="plus" data-icon-size="14"></button></div>
      <div class="pane-body">
        <div class="tree hidden" role="tree"></div>
        <div class="pane-center">
          <div class="list" tabindex="0"></div>
        </div>
        <div class="mini hidden" tabindex="0"><div class="mini-head"><span class="ic" data-icon="plus-square" data-icon-size="12"></span><span>Mini-scrap</span><span class="mini-hint">Ctrl+S sends</span></div><div class="mini-list"></div></div>
      </div>
      <div class="pane-foot"></div>
    </div>
    <div class="split-v" id="split-v"></div>
    <div class="pane" id="pane-R">
      <div class="tabs-row"><div class="tabs" role="tablist"></div><button class="tab-new chr-btn icon-only sm muted" title="New tab (Ctrl+T)" data-icon="plus" data-icon-size="14"></button></div>
      <div class="pane-body">
        <div class="tree hidden" role="tree"></div>
        <div class="pane-center">
          <div class="list" tabindex="0"></div>
        </div>
        <div class="mini hidden" tabindex="0"><div class="mini-head"><span class="ic" data-icon="plus-square" data-icon-size="12"></span><span>Mini-scrap</span></div><div class="mini-list"></div></div>
      </div>
      <div class="pane-foot"></div>
    </div>
    <div class="split-v hidden" id="split-p"></div>
    <div class="preview hidden" id="preview"></div>
  </div>

  <div id="statusbar">
    <span id="st-items">0 items</span>
    <span id="st-sel"></span>
    <span id="st-filter" class="hidden"></span>
    <span class="grow"></span>
    <span id="st-jobs"></span>
    <span id="st-drive"></span>
    <span id="st-mirror" class="hidden" title="Mirror browsing on"><span data-icon="mirror" data-icon-size="12"></span></span>
  </div>

  <div id="ctxmenu" role="menu"></div>
  <div id="overlay" class="hidden"></div>

  <!-- Full image viewer (IrfanView-style): zoom, pan, rotate, filmstrip, slideshow -->
  <div id="viewer" class="hidden" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="vw-top">
      <div class="vw-id">
        <span class="vw-ico" id="vw-ico" data-icon="file-image" data-icon-size="16"></span>
        <div class="vw-titles"><b id="vw-name">—</b><span id="vw-sub"></span></div>
      </div>
      <div class="vw-tools" role="toolbar" aria-label="Viewer tools">
        <button class="vw-btn" data-vw="prev" title="Previous (←)"><span data-icon="chevron-left"></span></button>
        <button class="vw-btn" data-vw="next" title="Next (→)"><span data-icon="chevron-right"></span></button>
        <span class="vw-sep"></span>
        <button class="vw-btn" data-vw="zoom-out" title="Zoom out (−)"><span data-icon="zoom-out"></span></button>
        <button class="vw-zoomlabel" id="vw-zoomlabel" title="Click for 100%">fit</button>
        <button class="vw-btn" data-vw="zoom-in" title="Zoom in (+)"><span data-icon="zoom-in"></span></button>
        <button class="vw-btn" data-vw="fit" title="Fit to window (0)"><span data-icon="fit"></span></button>
        <button class="vw-btn" data-vw="one" title="Actual size (1)"><span data-icon="one-to-one"></span></button>
        <span class="vw-sep"></span>
        <button class="vw-btn" data-vw="rotate-l" title="Rotate left ([)"><span data-icon="rotate-ccw"></span></button>
        <button class="vw-btn" data-vw="rotate-r" title="Rotate right (])"><span data-icon="rotate-cw"></span></button>
        <button class="vw-btn" data-vw="flip" title="Flip horizontally (H)"><span data-icon="flip-h"></span></button>
        <span class="vw-sep"></span>
        <button class="vw-btn" data-vw="slideshow" title="Slideshow (Space)"><span data-icon="play"></span></button>
        <button class="vw-btn" data-vw="info" title="Image information (I)"><span data-icon="info"></span></button>
        <button class="vw-btn" data-vw="fullscreen" title="Fullscreen (F11)"><span data-icon="expand"></span></button>
        <button class="vw-btn vw-close" data-vw="close" title="Close (Esc)"><span data-icon="close"></span></button>
      </div>
    </div>
    <div class="vw-stage" id="vw-stage">
      <img id="vw-img" alt="" draggable="false">
      <div class="vw-empty hidden" id="vw-empty"></div>
    </div>
    <div class="vw-hud">
      <span id="vw-hud-left"></span>
      <span id="vw-hud-right" class="vw-count"></span>
    </div>
    <div class="vw-info hidden" id="vw-info"></div>
    <div class="vw-film" id="vw-film" aria-label="Filmstrip"></div>
  </div>

  <!-- Quick Look: Space toggles a large preview of the focused item -->
  <div id="quicklook" class="hidden" role="dialog" aria-modal="true" aria-label="Quick look">
    <div class="ql-card">
      <div class="ql-head">
        <span class="ql-ico" id="ql-ico" data-icon="file"></span>
        <div class="ql-title"><b id="ql-name"></b><span id="ql-sub"></span></div>
        <div class="ql-act">
          <button class="chr-btn icon-only sm muted" id="ql-reveal" title="Show in folder"><span data-icon="external-link"></span></button>
          <button class="chr-btn icon-only sm muted" id="ql-open" title="Open with the default app (Enter)"><span data-icon="file-app"></span></button>
          <button class="chr-btn icon-only sm muted" id="ql-close" title="Close (Esc)"><span data-icon="close"></span></button>
        </div>
      </div>
      <div class="ql-body" id="ql-body"></div>
      <div class="ql-foot"><span><kbd>Space</kbd> close</span><span><kbd>↑</kbd><kbd>↓</kbd> previous / next</span><span><kbd>Enter</kbd> open</span></div>
    </div>
  </div>
  <div id="palette" class="hidden" role="dialog" aria-label="Command palette">
    <div class="pal-head"><span class="ic" data-icon="command" data-icon-size="14"></span><span class="pal-title">Command palette</span><kbd class="pal-kbd">Esc</kbd><button id="pal-close" class="chr-btn icon-only sm muted" title="Close" data-icon="close" data-icon-size="13"></button></div>
    <input class="pal-input chr-input" type="text" placeholder="Type a command…" autocomplete="off" spellcheck="false" aria-label="Command">
    <div class="pal-list"></div>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>Enter</kbd> run</span><span><kbd>Esc</kbd> close</span></div>
  </div>
  <div id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
