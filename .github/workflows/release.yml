name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/build-native.mjs
      - name: Build the app
        run: npx electron-vite build
        env:
          # the office's standing admins, kept out of the public source (comma-separated Windows accounts)
          HOPPER_STANDING_ADMINS: ${{ secrets.HOPPER_STANDING_ADMINS }}
      - name: Build installer and portable zip
        run: npx electron-builder --win --x64 --publish never
      - name: Checksums
        shell: bash
        run: |
          cd release
          sha256sum *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            version="${GITHUB_REF_NAME#v}"
            awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
            gh release create "$GITHUB_REF_NAME" --title "Hopper $GITHUB_REF_NAME" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release/*.exe release/*.zip release/*.blockmap release/latest.yml release/SHA256SUMS.txt --clobber
