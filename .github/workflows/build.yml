name: Build installers

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            script: dist:win
            slug: windows
          - name: macOS (x64 + arm64)
            os: macos-latest
            script: dist:mac
            slug: macos
          - name: Linux x64
            os: ubuntu-latest
            script: dist:linux
            slug: linux
    env:
      # Unsigned by default. Add CSC_LINK / CSC_KEY_PASSWORD (and the Apple
      # notarisation secrets) to sign; the build step drops empty values so
      # electron-builder never treats an unset secret as a file path.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm
      - run: npm ci
      - name: Regenerate icons
        run: npm run icons
      - name: Ensure release exists
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Xplorer² Modern $GITHUB_REF_NAME" \
              --generate-notes || true
          fi
      - name: Build installers
        shell: bash
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npm run ${{ matrix.script }} -- --publish never
      - name: Checksums
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          files=(*.exe *.dmg *.AppImage *.deb *.zip)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > "SHA256SUMS-${{ matrix.slug }}.txt"
            cat "SHA256SUMS-${{ matrix.slug }}.txt"
          fi
      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.AppImage release/*.deb release/*.zip release/SHA256SUMS-*.txt)
          if [ ${#files[@]} -eq 0 ]; then echo "no artifacts produced"; exit 1; fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh release 2>/dev/null | head -20 >> "$GITHUB_STEP_SUMMARY" || echo "no output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
