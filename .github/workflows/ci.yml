name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax, icon and asset guards
        run: npm run check
      - name: Verify packaging manifest
        run: node -e "const p=require('./package.json'); if(!p.build||!p.build.appId) process.exit(1); console.log('appId', p.build.appId, 'targets', Object.keys(p.build).filter(k=>['win','mac','linux'].includes(k)).join(','))"
